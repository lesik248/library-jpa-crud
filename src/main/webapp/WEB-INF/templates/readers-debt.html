<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Читатели с долгами</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="navbar">
    <a href="/DemoServlet/index.html">Главная</a>
    <a href="/DemoServlet/library/freeCopies">Свободные экземпляры</a>
    <a href="/DemoServlet/library/booksByAuthor">Книги автора</a>
    <a href="/DemoServlet/library/readersWithDebt">Должники</a>
    <a href="/DemoServlet/library/giveBook">Выдать книгу</a>
    <a href="/DemoServlet/library/removeBook">Списать книгу</a>
</div>


<h1>Читатели с просроченными книгами</h1>

<div class="container">

    <h1>Список должников</h1>

    <div class="result-box" th:if="${data}">
        <ul class="result-list">
            <li th:each="item : ${data}" th:text="${item}"></li>
        </ul>
    </div>

</div>

<div class="error" th:if="${error}" th:text="${error}"></div>

</body>
</html>
